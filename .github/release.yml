# GitHub categorizes merged PRs by labels, not conventional title/commit prefixes.
# Apply the corresponding labels to feat, fix, and chore/deps PRs; Dependabot
# supplies the dependencies label automatically. Unlabeled PRs fall under Other.
changelog:
  categories:
    - title: Features
      labels: [feat, enhancement]
    - title: Bug fixes
      labels: [fix, bug]
    - title: Maintenance and dependencies
      labels: [chore, deps, dependencies]
    - title: Other changes
      labels: ['*']
